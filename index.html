<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f07a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<title>Notor</title>
<style>
/* VOICE: calme, sans chichi, un carnet qu'on oublie
   IDEA: un carnet ligné, le stylet seul écrit
   PICTURE: la feuille elle-même, pleine hauteur
   COLOUR and TYPE: pierre / blanc, accent orange #f07a1a ; police système
   LAYOUT: vignettes à gauche, feuille à droite ; une seule vue sous 700px */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ef,#151413);--panel:light-dark(#fff,#1e1d1b);--ink:light-dark(#1b1a19,#ecebe8);--mute:light-dark(#8a857f,#8f8a84);--line:light-dark(#e4e0db,#2c2a27);--acc:#f07a1a;--sel:light-dark(#fff1e4,#2e2115)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=text]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,.btn{white-space:nowrap;flex:none;font:inherit;font-size:15px;color:var(--acc);background:none;border:0;cursor:pointer;border-radius:10px;min-height:40px;padding:0 10px;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:2px;padding:8px 8px 4px}
.top h1{font-size:20px;margin:0 auto 0 6px;letter-spacing:-.01em}
.top h1 b{color:var(--acc)}
.new{background:var(--acc);color:#fff;font-size:24px;width:40px;justify-content:center;padding:0}
.io{display:flex;gap:0;flex-wrap:wrap;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.io .btn{font-size:14px;min-height:34px;padding:0 8px}
.warn{margin:8px 8px 0;padding:8px 10px;border-radius:10px;background:var(--sel);font-size:13px}
.list{flex:1;overflow-y:auto;padding:8px}
.item{display:block;width:100%;padding:6px;margin-bottom:8px;border-radius:12px;min-height:0;color:var(--ink);text-align:left;white-space:normal}
.item.on{background:var(--sel)}
.item img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;background:#fff;border:1px solid var(--line)}
.item strong{display:block;font-size:14px;padding:5px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;font-size:12px;color:var(--mute);padding:0 2px}
.item span b{color:var(--acc);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:12px 6px}
main{display:flex;flex-direction:column;height:100%;background:var(--panel);overflow:hidden}
.bar{display:flex;align-items:center;gap:2px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .sep{flex:1}
.back{display:none}
.name{color:var(--ink);font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;display:block;line-height:40px}
.dot{width:40px;padding:0;justify-content:center}
.dot i{width:22px;height:22px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--panel),0 0 0 2px transparent;transition:box-shadow .15s}
.dot.on i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.tool.on{background:var(--sel)}
.sheet{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain}
.stick{position:sticky;top:0;height:0;z-index:1}
.stick canvas{position:absolute;left:0;top:0;touch-action:none;display:block}
#spacer{width:1px}
.ask{position:fixed;inset:0;display:none;place-items:center;background:#0006;z-index:9}
.ask.on{display:grid}
.ask form,.ask>div{background:var(--panel);border-radius:14px;padding:18px;width:min(340px,90vw);text-align:center}
.ask p{margin:0 0 14px}
.ask input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:14px;outline:0}
.ask input:focus{border-color:var(--acc)}
.ask button{width:48%;justify-content:center}
.ask .del{background:#d6402b;color:#fff}.ask .ok{background:var(--acc);color:#fff}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.msg.on{opacity:1}
@media(max-width:700px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{border:0}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;align-content:start}.item{margin:0}
 main{display:none}.app.edit aside{display:none}.app.edit main{display:flex}
 .back{display:inline-flex}.name{max-width:150px}
 .bar button{padding:0 7px}.dot{width:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
 <aside>
  <div class="top"><h1>Not<b>or</b></h1><button class="new" id="new" aria-label="Nouvelle note">+</button></div>
  <div class="io">
   <button class="btn" id="exp">Exporter</button>
   <button class="btn" id="zip">Tout en PDF</button>
   <label class="btn" id="impL">Importer<input type="file" id="imp" accept=".json,application/json" hidden></label>
  </div>
  <div class="warn" id="warn" hidden></div>
  <div class="list" id="list"></div>
 </aside>
 <main>
  <div class="bar">
   <button class="back" id="back">‹ Notes</button>
   <button class="name" id="name" title="Renommer">Sans titre</button>
   <span class="sep"></span>
   <span id="dots"></span>
   <button class="tool" id="er">Gomme</button>
   <span class="sep"></span>
   <button id="undo">↶ Annuler</button>
   <button id="redo">Rétablir ↷</button>
   <button id="pdf">PDF</button>
   <button id="pin">Épingler</button>
   <button id="trash">Supprimer</button>
  </div>
  <div class="sheet" id="sheet">
   <div class="stick"><canvas id="cv"></canvas><canvas id="live"></canvas></div>
   <div id="spacer"></div>
  </div>
 </main>
</div>
<div class="ask" id="ask"><div><p>Supprimer cette note ?</p><button id="no">Annuler</button> <button class="del" id="yes">Supprimer</button></div></div>
<div class="ask" id="ren"><form id="renF"><p>Nom de la note</p><input type="text" id="renI" maxlength="80" placeholder="Sans titre" autocomplete="off"><button type="button" id="renNo">Annuler</button> <button class="ok" type="submit">OK</button></form></div>
<div class="msg" id="msg"></div>
<script>
{
const $=id=>document.getElementById(id);
const app=$('app'),list=$('list'),sheet=$('sheet'),cv=$('cv'),live=$('live'),spacer=$('spacer');
const cx=cv.getContext('2d'),lx=live.getContext('2d');
const KEY='notor-v1',W=1000,LINE=44,BASE=3.6;
const COLORS=[['ink','Encre'],['#2457c5','Bleu'],['#d23a2a','Rouge'],['#2e8b4e','Vert'],['#f07a1a','Orange']];
let notes={},cur=null,color='ink',eraser=false,undoS=[],redoS=[],scale=1,pageH=1600,drawing=null,lastPen=0,pan=null;
const paths=new Map(),thumbs=new Map();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- stockage : IndexedDB, localStorage en secours ---------- */
let idb=null,saveT=null;
const openDB=()=>new Promise(r=>{setTimeout(()=>r(null),2000);try{const q=indexedDB.open('notor',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbGet=k=>new Promise(r=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbPut=(k,v)=>new Promise(r=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}});
async function load(){
 idb=await openDB();let d=idb?await idbGet('notes'):null;
 if(!d){try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){d={}}if(idb&&d&&Object.keys(d).length)await idbPut('notes',d)}
 notes=d||{};for(const id in notes){if(!Array.isArray(notes[id].ink))notes[id].ink=[];if(typeof notes[id].name!=='string')notes[id].name=(notes[id].text||'').trim().split('\n')[0].slice(0,80)}
}
const FULL='Enregistrement impossible (mémoire pleine ?). Exporte tes notes.';
function writeNow(){clearTimeout(saveT);saveT=null;
 if(idb)idbPut('notes',notes).then(ok=>{if(!ok)warn(FULL)});
 else try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){warn(FULL)}}
const save=()=>{if(!saveT)saveT=setTimeout(writeNow,300)};
addEventListener('pagehide',()=>{if(saveT)writeNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)writeNow()});
function warn(m){const w=$('warn');w.textContent=m;w.hidden=!m}
function toast(m){const e=$('msg');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ---------- traits : encodage et contour lissé à largeur variable ---------- */
const enc=st=>st.c+'|'+st.p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)+' '+q[2]).join(' ');
function dec(s){const parts=s.split('|');const a=parts[parts.length-1].split(' ').map(Number),p=[];
 for(let i=0;i+2<a.length;i+=3)p.push([a[i],a[i+1],a[i+2]]);return{c:parts[0],p}}
const rad=pr=>BASE*(.32+.95*pr/9)/2;
function outline(p){
 const L=[],R=[],r=[];
 for(let i=0;i<p.length;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];
  let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const ri=rad(p[i][2]);r.push(ri);
  L.push([p[i][0]-dy*ri,p[i][1]+dx*ri]);R.push([p[i][0]+dy*ri,p[i][1]-dx*ri])}
 return[L,R,r]}
function trace(ctx,p){
 if(!p.length)return;
 const[L,R,r]=outline(p);
 ctx.moveTo(p[0][0]+r[0],p[0][1]);ctx.arc(p[0][0],p[0][1],r[0],0,Math.PI*2);
 if(p.length<2)return;
 const n=p.length-1;ctx.moveTo(p[n][0]+r[n],p[n][1]);ctx.arc(p[n][0],p[n][1],r[n],0,Math.PI*2);
 const side=(S,first)=>{if(first)ctx.moveTo(S[0][0],S[0][1]);else ctx.lineTo(S[0][0],S[0][1]);
  for(let i=1;i<S.length-1;i++)ctx.quadraticCurveTo(S[i][0],S[i][1],(S[i][0]+S[i+1][0])/2,(S[i][1]+S[i+1][1])/2);
  ctx.lineTo(S[S.length-1][0],S[S.length-1][1])};
 side(L,1);side(R.slice().reverse(),0);ctx.closePath()}
function pathOf(s){let P=paths.get(s);if(!P){const st=dec(s);P={c:st.c,path:new Path2D(),y0:1e9,y1:-1e9,p:st.p};trace(P.path,st.p);
 for(const q of st.p){if(q[1]<P.y0)P.y0=q[1];if(q[1]>P.y1)P.y1=q[1]}paths.set(s,P)}return P}
const inkCol=()=>getComputedStyle(document.body).color;
const col=c=>c==='ink'?inkCol():c;

/* ---------- feuille : canevas de la taille de l'écran, défilement virtuel ---------- */
function size(){
 const n=notes[cur];const w=sheet.clientWidth,h=sheet.clientHeight;if(!w||!h)return;
 scale=w/W;let maxY=0;if(n)for(const s of n.ink){const P=pathOf(s);if(P.y1>maxY)maxY=P.y1}
 pageH=Math.max(h/scale+LINE*4,maxY+h/scale*.8);
 const dpr=Math.min(3,devicePixelRatio||1);
 for(const c of[cv,live]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px'}
 spacer.style.height=pageH*scale+'px';redraw();
}
function setT(ctx){const dpr=cv.width/sheet.clientWidth;ctx.setTransform(dpr*scale,0,0,dpr*scale,0,-sheet.scrollTop*dpr)}
function redraw(){
 const n=notes[cur];cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);if(!n)return;
 setT(cx);const top=sheet.scrollTop/scale,bot=top+sheet.clientHeight/scale;
 cx.strokeStyle=getComputedStyle(document.querySelector('.bar')).borderBottomColor;cx.lineWidth=1/scale;cx.beginPath();
 for(let y=Math.ceil(top/LINE)*LINE;y<bot;y+=LINE){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();
 const ic=inkCol();
 for(const s of n.ink){const P=pathOf(s);if(P.y1<top-10||P.y0>bot+10)continue;cx.fillStyle=P.c==='ink'?ic:P.c;cx.fill(P.path,'nonzero')}
}
sheet.addEventListener('scroll',()=>requestAnimationFrame(redraw),{passive:true});
const ro=new ResizeObserver(()=>size());ro.observe(sheet);

/* ---------- saisie : stylet uniquement, paume et doigts ignorés ---------- */
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale+sheet.scrollTop/scale,Math.max(1,Math.min(9,Math.round((e.pressure||.5)*9)))]};
const isPen=e=>e.pointerType==='pen'||e.pointerType==='mouse';
function snap(){const n=notes[cur];undoS.push(n.ink.slice());if(undoS.length>100)undoS.shift();redoS=[];btns()}
function erase(q){const n=notes[cur];const before=n.ink.length;
 n.ink=n.ink.filter(s=>{const P=pathOf(s);if(q[1]<P.y0-14||q[1]>P.y1+14)return true;return!P.p.some(a=>Math.hypot(a[0]-q[0],a[1]-q[1])<12)});
 if(n.ink.length!==before){redraw();changed()}}
live.addEventListener('pointerdown',e=>{
 const n=notes[cur];if(!n)return;
 if(!isPen(e)){ // doigt ou paume : défilement à un doigt, ignoré pendant et juste après le stylet
  if(drawing||Date.now()-lastPen<700)return;pan={id:e.pointerId,y:e.clientY,top:sheet.scrollTop};return}
 e.preventDefault();live.setPointerCapture(e.pointerId);pan=null;lastPen=Date.now();snap();
 const q=pos(e);
 if(eraser){drawing={id:e.pointerId,er:1};erase(q);return}
 drawing={id:e.pointerId,st:{c:color,p:[q]},raw:q};drawLive();
});
live.addEventListener('pointermove',e=>{
 if(pan&&e.pointerId===pan.id){sheet.scrollTop=pan.top-(e.clientY-pan.y);return}
 if(!drawing||e.pointerId!==drawing.id)return;lastPen=Date.now();
 const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 for(const ev of evs){const q=pos(ev);
  if(drawing.er){erase(q);continue}
  const p=drawing.st.p,l=p[p.length-1];
  const s=[l[0]+(q[0]-l[0])*.55,l[1]+(q[1]-l[1])*.55,Math.round(l[2]*.6+q[2]*.4)]; // lissage de la main
  if(Math.hypot(s[0]-l[0],s[1]-l[1])<.7)continue;p.push(s);drawing.raw=q}
 if(!drawing.er)drawLive();
});
function drawLive(){lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,live.width,live.height);setT(lx);
 lx.fillStyle=col(drawing.st.c);lx.beginPath();trace(lx,drawing.st.p);lx.fill('nonzero')}
const up=e=>{
 if(pan&&e.pointerId===pan.id)pan=null;
 if(!drawing||e.pointerId!==drawing.id)return;lastPen=Date.now();
 if(!drawing.er){const p=drawing.st.p,r=drawing.raw,l=p[p.length-1];if(Math.hypot(r[0]-l[0],r[1]-l[1])>.7)p.push([r[0],r[1],l[2]]);
  notes[cur].ink.push(enc(drawing.st));lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,live.width,live.height);
  const y=Math.max(...p.map(q=>q[1]));drawing=null;if(y>pageH-sheet.clientHeight/scale*.6)size();else redraw();changed()}
 else{const n=notes[cur];const last=undoS[undoS.length-1];if(last&&last.length===n.ink.length){undoS.pop();btns()}drawing=null}
};
live.addEventListener('pointerup',up);live.addEventListener('pointercancel',up);
live.addEventListener('touchstart',e=>{if([...e.touches].some(t=>t.touchType==='stylus'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!e.target.closest||!e.target.closest('input'))e.preventDefault()});

/* ---------- liste, vignettes, actions ---------- */
const when=t=>{const d=new Date(t),n=new Date();
 if(d.toDateString()===n.toDateString())return"Aujourd'hui "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})};
const sorted=()=>Object.values(notes).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t);
const nameOf=n=>n.name||'Sans titre';
function thumb(n){const k=n.t+':'+n.ink.length;let u=thumbs.get(n.id);if(u&&u.k===k)return u.url;
 const c=document.createElement('canvas');c.width=320;c.height=200;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,320,200);
 g.setTransform(320/W,0,0,320/W,0,0);for(const s of n.ink){const P=pathOf(s);if(P.y0>650)continue;g.fillStyle=P.c==='ink'?'#1b1a19':P.c;g.fill(P.path)}
 const url=c.toDataURL('image/jpeg',.7);thumbs.set(n.id,{k,url});return url}
function render(){
 const arr=sorted();
 list.innerHTML=arr.length?arr.map(n=>`<button class="item${n.id===cur?' on':''}" data-id="${esc(n.id)}"><img alt="" src="${thumb(n)}"><strong>${esc(nameOf(n))}</strong><span>${n.pin?'<b>Épinglée</b> · ':''}${esc(when(n.t))}</span></button>`).join('')
  :'<div class="empty">Aucune note. Touche + pour commencer.</div>';
 const n=notes[cur];$('pin').textContent=n&&n.pin?'Désépingler':'Épingler';$('name').textContent=n?nameOf(n):'';
 for(const b of['er','pdf','pin','trash','name'])$(b).disabled=!n;btns();
}
function btns(){$('undo').disabled=!notes[cur]||!undoS.length;$('redo').disabled=!notes[cur]||!redoS.length}
let listT=null;
function changed(){const n=notes[cur];n.t=Date.now();save();clearTimeout(listT);listT=setTimeout(render,400);btns()}
function open(id){cur=id||null;undoS=[];redoS=[];app.classList.toggle('edit',!!notes[cur]);sheet.scrollTop=0;render();size()}
function create(){const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);notes[id]={id,name:'',t:Date.now(),pin:false,ink:[]};save();open(id)}
function cleanEmpty(){for(const n of Object.values(notes))if(n.id!==cur&&!n.ink.length&&!n.name){delete notes[n.id];thumbs.delete(n.id)}save()}
$('dots').innerHTML=COLORS.map(([c,l],i)=>`<button class="dot${i?'':' on'}" data-c="${c}" aria-label="${l}"><i style="background:${c==='ink'?'var(--ink)':c}"></i></button>`).join('');
$('dots').addEventListener('click',e=>{const b=e.target.closest('.dot');if(!b)return;color=b.dataset.c;eraser=false;$('er').classList.remove('on');
 document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',x===b))});
$('er').onclick=()=>{eraser=!eraser;$('er').classList.toggle('on',eraser);document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',!eraser&&x.dataset.c===color))};
$('undo').onclick=()=>{const n=notes[cur];if(!n||!undoS.length)return;redoS.push(n.ink);n.ink=undoS.pop();size();changed()};
$('redo').onclick=()=>{const n=notes[cur];if(!n||!redoS.length)return;undoS.push(n.ink);n.ink=redoS.pop();size();changed()};
list.addEventListener('click',e=>{const b=e.target.closest('.item');if(b){cleanEmpty();open(b.dataset.id)}});
$('new').onclick=()=>{cleanEmpty();create()};
$('back').onclick=()=>{cur=null;app.classList.remove('edit');cleanEmpty();render()};
$('pin').onclick=()=>{const n=notes[cur];if(!n)return;n.pin=!n.pin;save();render()};
$('trash').onclick=()=>$('ask').classList.add('on');
$('no').onclick=()=>$('ask').classList.remove('on');
$('yes').onclick=()=>{$('ask').classList.remove('on');delete notes[cur];thumbs.delete(cur);save();const f=sorted()[0];open(f&&innerWidth>700?f.id:null)};

document.addEventListener('keydown',e=>{if(!(e.metaKey||e.ctrlKey)||e.target.closest('input'))return;const k=e.key.toLowerCase();
 if(k==='z'&&!e.shiftKey){e.preventDefault();$('undo').click()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();$('redo').click()}});

/* ---------- partage de fichiers (feuille de partage iPad, sinon téléchargement) ---------- */
async function deliver(blob,name){
 const f=new File([blob],name,{type:blob.type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
const stamp=()=>new Date().toISOString().slice(0,10);
const fname=n=>(n.name||'note').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,60)||'note';
$('exp').onclick=async()=>{const ok=await deliver(new Blob([JSON.stringify(notes)],{type:'application/json'}),'notor-'+stamp()+'.json');
 if(ok){try{localStorage.setItem(KEY+'-export',Date.now())}catch(e){}warn('')}};
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());let k=0;
 for(const id in d){const v=d[id];if(!v||typeof v!=='object'||!/^[\w-]+$/.test(id))continue;const l=notes[id];
  if(!l||(+v.t||0)>l.t){notes[id]={id,name:String(v.name||'').slice(0,80),t:+v.t||Date.now(),pin:!!v.pin,ink:Array.isArray(v.ink)?v.ink.map(String):[]};k++}}
 save();render();toast(k+' note(s) importée(s)')}catch(err){toast('Fichier illisible')}e.target.value=''};

/* ---------- export PDF vectoriel (A4, sans bibliothèque) ---------- */
function hex(c){if(c==='ink')return'0 0 0';const m=c.match(/^#(..)(..)(..)$/);return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(' '):'0 0 0'}
function pdfOf(n){
 const PW=595.28,PHt=841.89,k=PW/W,PH=PHt/k;let maxY=0;for(const s of n.ink){const P=pathOf(s);if(P.y1>maxY)maxY=P.y1}
 const pages=Math.max(1,Math.ceil((maxY+10)/PH)),f=v=>v.toFixed(1),streams=[];
 const circ=(x,y,r)=>{const c=r*.5523;return`${f(x+r)} ${f(y)} m ${f(x+r)} ${f(y+c)} ${f(x+c)} ${f(y+r)} ${f(x)} ${f(y+r)} c ${f(x-c)} ${f(y+r)} ${f(x-r)} ${f(y+c)} ${f(x-r)} ${f(y)} c ${f(x-r)} ${f(y-c)} ${f(x-c)} ${f(y-r)} ${f(x)} ${f(y-r)} c ${f(x+c)} ${f(y-r)} ${f(x+r)} ${f(y-c)} ${f(x+r)} ${f(y)} c f\n`};
 for(let pg=0;pg<pages;pg++){let s=`${k.toFixed(5)} 0 0 ${(-k).toFixed(5)} 0 ${PHt.toFixed(2)} cm 1 0 0 1 0 ${f(-pg*PH)} cm\n`;
  for(const str of n.ink){const P=pathOf(str);if(P.y1<pg*PH-5||P.y0>(pg+1)*PH+5)continue;const p=P.p;s+=hex(P.c)+' rg\n';
   const[L,R,r]=outline(p);s+=circ(p[0][0],p[0][1],r[0]);
   if(p.length>1){s+=circ(p[p.length-1][0],p[p.length-1][1],r[p.length-1]);const poly=L.concat(R.slice().reverse());
    s+=poly.map((q,i)=>f(q[0])+' '+f(q[1])+(i?' l':' m')).join('\n')+' h f\n'}}
  streams.push(s)}
 const objs=[],kids=[];
 objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
 streams.forEach((s,i)=>{const po=3+i*2,co=4+i*2;kids.push(po+' 0 R');
  objs[po]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PHt}] /Contents ${co} 0 R /Resources << >> >>`;
  objs[co]=`<< /Length ${s.length} >>\nstream\n${s}endstream`});
 objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
 let out='%PDF-1.4\n';const off=[];
 for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const x=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
 out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
 return new Blob([out],{type:'application/pdf'})}
$('pdf').onclick=()=>{const n=notes[cur];if(n)deliver(pdfOf(n),fname(n)+'.pdf')};

/* ---------- zip de toutes les notes en PDF (format zip simple, sans compression) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipOf(files){ // files: [{name, data:Uint8Array}]
 const te=new TextEncoder(),parts=[],cent=[];let off=0;
 const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
 for(const f of files){const nm=te.encode(f.name),c=crc32(f.data),sz=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
  h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);
  parts.push(h,nm,f.data);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
  e.setUint32(16,c,true);e.setUint32(20,sz,true);e.setUint32(24,sz,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);cent.push(e,nm);
  off+=30+nm.length+sz}
 const cs=cent.reduce((a,x)=>a+x.byteLength,0),end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cent,end],{type:'application/zip'})}
$('zip').onclick=async()=>{const arr=sorted().filter(n=>n.ink.length);if(!arr.length){toast('Aucune note à exporter');return}
 const used={},files=[];
 for(const n of arr){let b=fname(n);if(!n.name)b='note '+new Date(n.t).toISOString().slice(0,16).replace('T',' ').replace(':','h');
  let nm=b,i=2;while(used[nm.toLowerCase()])nm=b+' ('+(i++)+')';used[nm.toLowerCase()]=1;
  files.push({name:nm+'.pdf',data:new Uint8Array(await pdfOf(n).arrayBuffer())})}
 deliver(zipOf(files),'notor-pdf-'+stamp()+'.zip')};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
load().then(()=>{
 for(const n of Object.values(notes))if(!n.ink.length&&!n.name)delete notes[n.id]; // notes vides
 const f=sorted()[0];open(f&&innerWidth>700?f.id:null);
 let last=0;try{last=+localStorage.getItem(KEY+'-export')||0}catch(e){}
 if(Object.keys(notes).length&&Date.now()-last>7*864e5)warn(last?'Dernière sauvegarde il y a plus d’une semaine : touche Exporter.':'Pense à sauvegarder : touche Exporter.');
});
}
