<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f07a1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<title>Notor</title>
<style>
/* VOICE: calme, sans chichi, un carnet qu'on oublie
   IDEA: un carnet ligné, le stylet seul écrit
   PICTURE: la feuille elle-même, pleine hauteur
   COLOUR and TYPE: pierre / blanc, accent orange #f07a1a ; police système
   LAYOUT: liste fine à gauche, feuille à droite ; une seule vue sous 900px */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ef,#151413);--panel:light-dark(#fff,#1e1d1b);--ink:light-dark(#1b1a19,#ecebe8);--mute:light-dark(#8a857f,#8f8a84);--line:light-dark(#e4e0db,#2c2a27);--acc:#f07a1a;--sel:light-dark(#fff1e4,#2e2115)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=text]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button,.btn{white-space:nowrap;flex:none;font:inherit;font-size:15px;color:var(--acc);background:none;border:0;cursor:pointer;border-radius:10px;min-height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic{width:40px;padding:0}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:2px;padding:8px 8px 4px}
.top h1{font-size:20px;margin:0 auto 0 6px;letter-spacing:-.01em}
.top h1 b{color:var(--acc)}
.new{background:var(--acc);color:#fff;font-size:24px;width:40px;padding:0}
.io{display:flex;flex-wrap:wrap;padding:0 4px 6px;border-bottom:1px solid var(--line)}
.io .btn{font-size:14px;min-height:34px;padding:0 8px}
.warn{margin:8px 8px 0;padding:8px 10px;border-radius:10px;background:var(--sel);font-size:13px}
.list{flex:1;overflow-y:auto;padding:6px}
.item{display:block;width:100%;padding:8px 10px;margin:1px 0;min-height:0;color:var(--ink);text-align:left}
.item.on{background:var(--sel)}
.item strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;font-size:13px;color:var(--mute)}
.item span b{color:var(--acc);font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:12px 6px}
main{display:flex;flex-direction:column;height:100%;background:var(--panel);overflow:hidden;position:relative}
.bar{display:flex;align-items:center;gap:0;padding:4px 6px;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto}
.bar .sep{flex:1 1 8px;min-width:8px}
.bar .div{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.back{display:none}
.title{display:flex;align-items:center;flex:0 1 190px;min-width:70px;overflow:hidden}
.title span{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.title button{color:var(--mute)}
.dot{width:32px;padding:0}
.dot i{width:20px;height:20px;border-radius:50%;display:block;box-shadow:0 0 0 2px var(--panel),0 0 0 2px transparent;transition:box-shadow .15s}
.dot.on i{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.tool{color:var(--mute)}.tool.on{background:var(--sel);color:var(--acc)}
.sheet{flex:1;overflow-y:auto;position:relative;overscroll-behavior:contain}
.stick{position:sticky;top:0;height:0;z-index:1}
.stick canvas{position:absolute;left:0;top:0;touch-action:none;display:block}
#spacer{width:1px}
.pop{position:absolute;z-index:5;display:none;background:var(--ink);border-radius:12px;padding:3px;box-shadow:0 4px 16px #0003;transform:translate(-50%,-100%)}
.pop.on{display:flex}
.pop button{color:var(--panel);font-size:14px;min-height:38px}
.pop .okb{background:var(--acc);color:#fff;width:42px;padding:0}
.ask{position:fixed;inset:0;display:none;place-items:center;background:#0006;z-index:9}
.ask.on{display:grid}
.ask form,.ask>div{background:var(--panel);border-radius:14px;padding:18px;width:min(340px,90vw);text-align:center}
.ask p{margin:0 0 14px}
.ask input{width:100%;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:14px;outline:0}
.ask input:focus{border-color:var(--acc)}
.ask button{width:48%}
.ask .del{background:#d6402b;color:#fff}.ask .ok{background:var(--acc);color:#fff}
.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.msg.on{opacity:1}
@media(max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{border:0}
 main{display:none}.app.edit aside{display:none}.app.edit main{display:flex}
 .back{display:inline-flex}
}
@media(max-width:600px){.title{flex-basis:110px}.dot{width:28px}.ic{width:36px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg style="display:none">
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
 <symbol id="i-ren" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
 <symbol id="i-pen" viewBox="0 0 24 24"><path d="M5 19l1.5-5L16 4.5l3.5 3.5L10 17.5z"/><path d="M5 19l3.5-1"/></symbol>
 <symbol id="i-er" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.5 15.5l9-9a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L11 19H8z"/><path d="M9 11l5 5"/></symbol>
 <symbol id="i-erp" viewBox="0 0 24 24"><path d="M7 15.5l7-7a1.8 1.8 0 012.5 0l1 1a1.8 1.8 0 010 2.5l-6 6H8.5z"/><path d="M2.5 21h4M10.5 21h3M17.5 21h4"/></symbol>
 <symbol id="i-sel" viewBox="0 0 24 24"><path d="M12 4c5 0 8 2.5 8 5.5S16.5 15 12 15c-2 0-3.5-.4-4.6-1" stroke-dasharray="3 2.5"/><path d="M7.4 14C5 13 4 11.3 4 9.5 4 6.5 7 4 12 4"/><path d="M7.5 14c-1 1.5-.5 3.5 1.5 5"/></symbol>
 <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0 -6)"/></symbol>
 <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H10a6 6 0 000 12" transform="translate(0 -6)"/></symbol>
 <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 10v7m-3-3l3 3 3-3"/></symbol>
 <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3z"/><path d="M12 12v8"/></symbol>
 <symbol id="i-pinf" viewBox="0 0 24 24"><path d="M9 4h6l-1 5 3 3H7l3-3z" fill="currentColor"/><path d="M12 12v8"/></symbol>
 <symbol id="i-del" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
</svg>
<div class="app" id="app">
 <aside>
  <div class="top"><h1>Not<b>or</b></h1><button class="new" id="new" aria-label="Nouvelle note">+</button></div>
  <div class="io">
   <button class="btn" id="exp">Exporter</button>
   <button class="btn" id="zip">Tout en zip</button>
   <label class="btn" id="impL">Importer<input type="file" id="imp" accept=".json,application/json" hidden></label>
  </div>
  <div class="warn" id="warn" hidden></div>
  <div class="list" id="list"></div>
 </aside>
 <main id="main">
  <div class="bar">
   <button class="ic back" id="back" aria-label="Notes"><svg><use href="#i-back"/></svg></button>
   <div class="title"><span id="name">Sans titre</span><button class="ic" id="ren" aria-label="Renommer"><svg><use href="#i-ren"/></svg></button></div>
   <span class="sep"></span>
   <span id="dots" style="display:flex;flex:none"></span>
   <span class="div"></span>
   <button class="ic tool on" id="t-pen" aria-label="Stylo"><svg><use href="#i-pen"/></svg></button>
   <button class="ic tool" id="t-er" aria-label="Gomme trait entier"><svg><use href="#i-er"/></svg></button>
   <button class="ic tool" id="t-erp" aria-label="Gomme partielle"><svg><use href="#i-erp"/></svg></button>
   <button class="ic tool" id="t-sel" aria-label="Sélection"><svg><use href="#i-sel"/></svg></button>
   <span class="div"></span>
   <button class="ic" id="undo" aria-label="Annuler"><svg><use href="#i-undo"/></svg></button>
   <button class="ic" id="redo" aria-label="Rétablir"><svg><use href="#i-redo"/></svg></button>
   <span class="sep"></span>
   <button class="ic" id="pdf" aria-label="PDF"><svg><use href="#i-pdf"/></svg></button>
   <button class="ic" id="pin" aria-label="Épingler"><svg><use href="#i-pin"/></svg></button>
   <button class="ic" id="trash" aria-label="Supprimer"><svg><use href="#i-del"/></svg></button>
  </div>
  <div class="sheet" id="sheet">
   <div class="stick"><canvas id="cv"></canvas><canvas id="live"></canvas></div>
   <div id="spacer"></div>
  </div>
  <div class="pop" id="pop"><button id="p-copy">Copier</button><button id="p-cut">Effacer</button><button id="p-reset" aria-label="Revenir à la position d'origine" style="font-size:18px;width:40px;padding:0">↺</button><button class="okb" id="p-ok" aria-label="Valider">✓</button></div>
  <div class="pop" id="paste"><button id="p-paste">Coller</button></div>
 </main>
</div>
<div class="ask" id="ask"><div><p>Supprimer cette note ?</p><button id="no">Annuler</button> <button class="del" id="yes">Supprimer</button></div></div>
<div class="ask" id="renD"><form id="renF"><p>Nom de la note</p><input type="text" id="renI" maxlength="80" placeholder="Sans titre" autocomplete="off"><button type="button" id="renNo">Annuler</button> <button class="ok" type="submit">OK</button></form></div>
<div class="msg" id="msg"></div>
<script>
{
function W_A4(){return 1000*841.89/595.28} // hauteur d'une page A4 en unités de la feuille (largeur 1000)
const $=id=>document.getElementById(id);
const app=$('app'),list=$('list'),sheet=$('sheet'),cv=$('cv'),live=$('live'),spacer=$('spacer'),main=$('main');
const cx=cv.getContext('2d'),lx=live.getContext('2d');
const A4=W_A4(),KEY='notor-v1',W=1000,LINE=A4/32,BASE=5.4,ERR=16,HANDLE_PX=34;
const COLORS=[['ink','Encre'],['#2457c5','Bleu'],['#d23a2a','Rouge'],['#2e8b4e','Vert'],['#f07a1a','Orange']];
let notes={},cur=null,color='ink',tool='pen',undoS=[],redoS=[],scale=1,pageH=1600,drawing=null,lastPen=0,pan=null;
let sel=null,clip=null,lasso=null,drag=null,pasteAt=null,HANDLE=40;
const paths=new Map();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- stockage : IndexedDB, localStorage en secours ---------- */
let idb=null,saveT=null;
const openDB=()=>new Promise(r=>{setTimeout(()=>r(null),2000);try{const q=indexedDB.open('notor',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbGet=k=>new Promise(r=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbPut=(k,v)=>new Promise(r=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}});
async function load(){
 idb=await openDB();let d=idb?await idbGet('notes'):null;
 if(!d){try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){d={}}if(idb&&d&&Object.keys(d).length)await idbPut('notes',d)}
 notes=d||{};for(const id in notes){const n=notes[id];if(!Array.isArray(n.ink))n.ink=[];if(typeof n.name!=='string')n.name=(n.text||'').trim().split('\n')[0].slice(0,80)}
}
const FULL='Enregistrement impossible (mémoire pleine ?). Exporte tes notes.';
function writeNow(){clearTimeout(saveT);saveT=null;
 if(idb)idbPut('notes',notes).then(ok=>{if(!ok)warn(FULL)});
 else try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){warn(FULL)}}
const save=()=>{if(!saveT)saveT=setTimeout(writeNow,300)};
addEventListener('pagehide',()=>{commitSel();if(saveT)writeNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){commitSel();if(saveT)writeNow()}});
function warn(m){const w=$('warn');w.textContent=m;w.hidden=!m}
function toast(m){const e=$('msg');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- traits : encodage et contour lissé à largeur variable ---------- */
const enc=st=>st.c+'|'+st.p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)+' '+q[2]).join(' ');
function dec(s){const parts=s.split('|');const a=parts[parts.length-1].split(' ').map(Number),p=[];
 for(let i=0;i+2<a.length;i+=3)p.push([a[i],a[i+1],a[i+2]]);return{c:parts[0],p}}
// épaisseur selon l'appui : 2 (léger) à 9 (fort). 1 = anciens traits, gardés à leur épaisseur d'origine
const rad=pr=>BASE*(pr<=1?.425:.2+.06*pr)/2;
function outline(p){const L=[],R=[],r=[];
 for(let i=0;i<p.length;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)];
  let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;const ri=rad(p[i][2]);r.push(ri);
  L.push([p[i][0]-dy*ri,p[i][1]+dx*ri]);R.push([p[i][0]+dy*ri,p[i][1]-dx*ri])}
 return[L,R,r]}
function trace(ctx,p){
 if(!p.length)return;const[L,R,r]=outline(p);
 let A=0;const poly=L.concat(R.slice().reverse());for(let i=0,j=poly.length-1;i<poly.length;j=i++)A+=(poly[j][0]-poly[i][0])*(poly[j][1]+poly[i][1]);
 const ac=A<0; // les bouts arrondis tournent dans le même sens que le contour (sinon trous)
 ctx.moveTo(p[0][0]+r[0],p[0][1]);ctx.arc(p[0][0],p[0][1],r[0],0,Math.PI*2*(ac?-1:1),ac);
 if(p.length<2)return;
 const n=p.length-1;ctx.moveTo(p[n][0]+r[n],p[n][1]);ctx.arc(p[n][0],p[n][1],r[n],0,Math.PI*2*(ac?-1:1),ac);
 const side=(S,first)=>{if(first)ctx.moveTo(S[0][0],S[0][1]);else ctx.lineTo(S[0][0],S[0][1]);
  for(let i=1;i<S.length-1;i++)ctx.quadraticCurveTo(S[i][0],S[i][1],(S[i][0]+S[i+1][0])/2,(S[i][1]+S[i+1][1])/2);
  ctx.lineTo(S[S.length-1][0],S[S.length-1][1])};
 side(L,1);side(R.slice().reverse(),0);ctx.closePath()}
function pathOf(s){let P=paths.get(s);if(!P){const st=dec(s);P={c:st.c,path:new Path2D(),x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,p:st.p};trace(P.path,st.p);
 for(const q of st.p){P.x0=Math.min(P.x0,q[0]);P.x1=Math.max(P.x1,q[0]);P.y0=Math.min(P.y0,q[1]);P.y1=Math.max(P.y1,q[1])}
 if(paths.size>6000)paths.clear();paths.set(s,P)}return P}
const inkCol=()=>getComputedStyle(document.body).color;
const SHADE={'#2457c5':'#3f80ea','#d23a2a':'#ec5a4c','#2e8b4e':'#3cb468'}; // couleurs plus claires à l'affichage
const shade=c=>SHADE[c]||c;
const col=c=>c==='ink'?inkCol():shade(c);

/* ---------- feuille : canevas de la taille de l'écran, défilement virtuel ---------- */
function size(){
 const n=notes[cur];const w=sheet.clientWidth,h=sheet.clientHeight;if(!w||!h)return;
 scale=w/W;HANDLE=HANDLE_PX/scale;let maxY=0;if(n)for(const s of n.ink){const P=pathOf(s);if(P.y1>maxY)maxY=P.y1}
 if(sel)maxY=Math.max(maxY,selBox().y1);
 pageH=Math.max(1,Math.ceil((maxY+h/scale*.5)/A4))*A4+LINE*3; // pages A4 entières + un peu de la suivante
 const dpr=Math.min(3,devicePixelRatio||1);
 for(const c of[cv,live]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px'}
 spacer.style.height=pageH*scale+'px';redraw();
}
function setT(ctx){const dpr=cv.width/sheet.clientWidth;ctx.setTransform(dpr*scale,0,0,dpr*scale,0,-sheet.scrollTop*dpr)}
function redraw(){
 const n=notes[cur];cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
 if(n){setT(cx);const top=sheet.scrollTop/scale,bot=top+sheet.clientHeight/scale;
  cx.strokeStyle=getComputedStyle(document.querySelector('.bar')).borderBottomColor;cx.lineWidth=1/scale;cx.beginPath();
  for(let y=Math.ceil(top/LINE)*LINE;y<bot;y+=LINE){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();
  // repères de coupure A4 : deux petits traits sur les bords, posés sur une ligne
  cx.strokeStyle='#f07a1a';cx.lineWidth=2.5/scale;cx.lineCap='round';cx.beginPath();
  for(let y=Math.max(1,Math.ceil(top/A4))*A4;y<bot+1;y+=A4){cx.moveTo(0,y);cx.lineTo(28,y);cx.moveTo(W-28,y);cx.lineTo(W,y)}cx.stroke();
  const ic=inkCol();
  for(const s of n.ink){const P=pathOf(s);if(P.y1<top-10||P.y0>bot+10)continue;cx.fillStyle=P.c==='ink'?ic:shade(P.c);cx.fill(P.path,'nonzero')}}
 drawLive();
}
sheet.addEventListener('scroll',()=>requestAnimationFrame(redraw),{passive:true});

/* ---------- calque du dessus : trait en cours, lasso, sélection ---------- */
function drawLive(){
 lx.setTransform(1,0,0,1,0,0);lx.clearRect(0,0,live.width,live.height);setT(lx);
 if(drawing&&drawing.st){lx.fillStyle=col(drawing.st.c);lx.beginPath();trace(lx,drawing.st.p);lx.fill('nonzero')}
 if(lasso&&lasso.length>1){lx.strokeStyle='#f07a1a';lx.lineWidth=1.6/scale;lx.lineCap='round';lx.lineWidth=2.6/scale;lx.setLineDash([.01,7/scale]);lx.beginPath();
  lasso.forEach((q,i)=>i?lx.lineTo(q[0],q[1]):lx.moveTo(q[0],q[1]));lx.stroke();lx.setLineDash([])}
 if(sel){const b=sel.box,c=sel.c;lx.save();lx.translate(c[0]+sel.tx,c[1]+sel.ty);lx.rotate(sel.a);lx.translate(-c[0],-c[1]);
  const ic=inkCol();for(const s of sel.strokes){const P=pathOf(s);lx.fillStyle=P.c==='ink'?ic:shade(P.c);lx.fill(P.path,'nonzero')}
  lx.strokeStyle='#f07a1a';lx.lineCap='round';lx.lineWidth=2.6/scale;lx.setLineDash([.01,7/scale]);lx.strokeRect(b.x0-10,b.y0-10,b.x1-b.x0+20,b.y1-b.y0+20);lx.setLineDash([]);
  const hy=b.y0-10-HANDLE;lx.beginPath();lx.moveTo(c[0],b.y0-10);lx.lineTo(c[0],hy+11/scale);lx.stroke();
  lx.fillStyle='#fff';lx.beginPath();lx.arc(c[0],hy,11/scale,0,Math.PI*2);lx.fill();lx.stroke();
  lx.beginPath();lx.arc(c[0],hy,5/scale,-2.2,1.3);lx.stroke();lx.restore()}
 placePop();
}
function toScreen(q){const sr=sheet.getBoundingClientRect(),mr=main.getBoundingClientRect();return[q[0]*scale+sr.left-mr.left,q[1]*scale-sheet.scrollTop+sr.top-mr.top]}
function placePop(){
 const pop=$('pop');if(!sel||drag){pop.classList.remove('on')}else{const b=selBox();const s=toScreen([(b.x0+b.x1)/2,b.y0]);
  pop.style.left=Math.min(Math.max(s[0],110),main.clientWidth-110)+'px';

/* ---------- sélection : soulever, déplacer, pivoter, copier, effacer, valider ---------- */
const xf=(q,S=sel)=>{const dx=q[0]-S.c[0],dy=q[1]-S.c[1],co=Math.cos(S.a),si=Math.sin(S.a);return[S.c[0]+dx*co-dy*si+S.tx,S.c[1]+dx*si+dy*co+S.ty]};

function boxOf(strokes){const b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};for(const s of strokes){const P=pathOf(s);b.x0=Math.min(b.x0,P.x0);b.y0=Math.min(b.y0,P.y0);b.x1=Math.max(b.x1,P.x1);b.y1=Math.max(b.y1,P.y1)}return b}
function selBox(){const b=sel.box,pts=[[sel.c[0],b.y0-HANDLE-20],[b.x1+10,b.y0-10],[b.x0-10,b.y1+10],[b.x1+10,b.y1+10],[b.x0-10,b.y0-10]].map(q=>xf(q));
 return{x0:Math.min(...pts.map(q=>q[0])),x1:Math.max(...pts.map(q=>q[0])),y0:Math.min(...pts.map(q=>q[1])),y1:Math.max(...pts.map(q=>q[1]))}}
function makeSel(strokes){const box=boxOf(strokes);sel={strokes,box,c:[(box.x0+box.x1)/2,(box.y0+box.y1)/2],tx:0,ty:0,a:0};btns()}
function bakedStrokes(S=sel){return S.strokes.map(s=>{const st=dec(s);st.p=st.p.map(q=>{const r=xf(q,S);return[r[0],r[1],q[2]]});return enc(st)})}
function commitSel(){if(!sel)return;const n=notes[cur];if(n){n.ink.push(...bakedStrokes())}sel=null;if(n){size();changed()}else drawLive()}
function inside(q,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];
 if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function finishLasso(){const poly=lasso;lasso=null;const n=notes[cur];if(!n||!poly||poly.length<3){drawLive();return}
 const pick=[],rest=[];for(const s of n.ink){const P=pathOf(s);let k=0;for(const q of P.p)if(inside(q,poly))k++;(k/P.p.length>=.5?pick:rest).push(s)}

$('p-ok').onclick=()=>commitSel();
$('p-reset').onclick=()=>{if(!sel)return;sel.tx=sel.ty=sel.a=0;size()};
$('p-cut').onclick=()=>{if(!sel)return;sel=null;size();changed();toast('Sélection effacée')};
$('p-copy').onclick=()=>{if(!sel)return;const st=bakedStrokes();const b=boxOf(st);const c=[(b.x0+b.x1)/2,(b.y0+b.y1)/2];
 clip=st.map(s=>{const d=dec(s);d.p=d.p.map(q=>[q[0]-c[0],q[1]-c[1],q[2]]);return enc(d)});commitSel();
 toast('Copié. Outil sélection : maintiens le stylet sur un endroit vide pour coller.')};
$('p-paste').onclick=()=>{if(!clip||!pasteAt||!notes[cur])return;const at=pasteAt;pasteAt=null;commitSel();snap();
 makeSel(clip.map(s=>{const d=dec(s);d.p=d.p.map(q=>[q[0]+at[0],q[1]+at[1],q[2]]);return enc(d)}));size()};

/* ---------- formes : maintenir le stylet immobile en fin de tracé ---------- */
/* angles et lignes brisées : simplification Ramer-Douglas-Peucker, gardée seulement si les coins sont francs */
function rdp(p,eps,a=0,b=p.length-1,out=[0]){let m=0,k=-1;const A=p[a],B=p[b],L=Math.hypot(B[0]-A[0],B[1]-A[1])||1;

 for(let i=0;i<n;i++)if(Math.hypot(v[i+1][0]-v[i][0],v[i+1][1]-v[i][1])<.08*diag)return null;
 const ang=(a,b,c)=>{const t=Math.abs(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0]));return Math.min(t,2*Math.PI-t)};
 for(let i=closed?0:1;i<(closed?n:n);i++){const a=v[(i-1+n)%n],b=v[i],c=v[i+1];if(ang(closed&&i===0?v[n-1]:a,b,c)<.35)return null}
 let err=0;for(const q of p){let d=1e9;for(let i=0;i<n;i++)d=Math.min(d,segDist(q,v[i],v[i+1]));err+=d}
 if(err/p.length>.02*diag)return null;
 const o=[];for(let i=0;i<n;i++)o.push(...seg(v[i],v[i+1]));o.push([v[n][0],v[n][1],pr]);o.n=n;return o}
function recognize(p){
 if(p.length<6)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,len=0;

 const w=x1-x0,h=y1-y0,diag=Math.hypot(w,h);if(diag<25)return null;
 const s=p[0],e=p[p.length-1],chord=Math.hypot(e[0]-s[0],e[1]-s[1]),pr=Math.round(p.reduce((a,q)=>a+q[2],0)/p.length);
 const seg=(a,b)=>{const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/3)),o=[];for(let i=0;i<n;i++)o.push([a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n,pr]);return o};
 { // ligne droite : on ignore les petits crochets aux deux bouts, et on tolère une main qui tremble
  // on écarte tout ce qui reste près des deux bouts (tremblement, crochet, gribouillis d'arrêt), quelle que soit sa longueur
  const D=Math.max(10,.13*chord);let i0=0,i1=p.length-1;
  for(let i=0;i<p.length;i++)if(Math.hypot(p[i][0]-s[0],p[i][1]-s[1])>D){i0=i;break}
  for(let i=p.length-1;i>=0;i--)if(Math.hypot(p[i][0]-e[0],p[i][1]-e[1])>D){i1=i;break}
  if(i1-i0>=2){const A=p[i0],B=p[i1],cl=Math.hypot(B[0]-A[0],B[1]-A[1]);let tl=0;for(let i=i0+1;i<=i1;i++)tl+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
   if(cl>25&&cl>.8*tl){let m=0,sum=0;for(let i=i0;i<=i1;i++){const d=segDist(p[i],A,B);m=Math.max(m,d);sum+=d}

     const S=pj(s),E=pj(e);return[...seg(S,E),[E[0],E[1],pr]]}}}}
 const closed=chord<=.3*diag;
 if(!closed||w<15||h<15)return polyFit(p,diag,false,seg,pr);

function finish(p,r){let l=p[p.length-1];for(let i=0;i<6&&Math.hypot(r[0]-l[0],r[1]-l[1])>.7;i++){l=[l[0]+(r[0]-l[0])*.5,l[1]+(r[1]-l[1])*.5,l[2]];p.push(l)}}
function despike(p){const o=[p[0]];for(let i=1;i<p.length;i++){const l=o[o.length-1],k=o[o.length-2];

function armHold(){const d=drawing;clearTimeout(d.hold);d.hold=setTimeout(()=>{if(drawing!==d||!d.st||d.snapped)return;

const near=(P,q)=>!(q[0]<P.x0-ERR||q[0]>P.x1+ERR||q[1]<P.y0-ERR||q[1]>P.y1+ERR);
function eraseWhole(q){const n=notes[cur],before=n.ink.length;

$('trash').onclick=()=>$('ask').classList.add('on');
$('no').onclick=()=>$('ask').classList.remove('on');

document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input'))return;
 if(e.key==='Escape'&&sel){commitSel();return}
 if(!(e.metaKey||e.ctrlKey))return;const k=e.key.toLowerCase();
 if(k==='z'&&!e.shiftKey){e.preventDefault();$('undo').click()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();$('redo').click()}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- partage de fichiers (feuille de partage iPad, sinon téléchargement) ---------- */
async function deliver(blob,name){
 const f=new File([blob],name,{type:blob.type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return true}catch(e){if(e.name==='AbortError')return false}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
const stamp=()=>new Date().toISOString().slice(0,10);
const fname=n=>(n.name||'note').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,60)||'note';
$('exp').onclick=async()=>{commitSel();const ok=await deliver(new Blob([JSON.stringify(notes)],{type:'application/json'}),'notor-'+stamp()+'.json');
 if(ok){try{localStorage.setItem(KEY+'-export',Date.now())}catch(e){}warn('')}};
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());let k=0;
 for(const id in d){const v=d[id];if(!v||typeof v!=='object'||!/^[\w-]+$/.test(id))continue;const l=notes[id];
  if(!l||(+v.t||0)>l.t){notes[id]={id,name:String(v.name||'').slice(0,80),t:+v.t||Date.now(),pin:!!v.pin,ink:Array.isArray(v.ink)?v.ink.map(String):[]};k++}}
 save();render();redraw();toast(k+' note(s) importée(s)')}catch(err){toast('Fichier illisible')}e.target.value=''};

/* ---------- export PDF vectoriel (A4, sans bibliothèque) ---------- */
function hex(c){if(c==='ink')return'0 0 0';const m=shade(c).match(/^#(..)(..)(..)$/);return m?[1,2,3].map(i=>(parseInt(m[i],16)/255).toFixed(3)).join(' '):'0 0 0'}
function pdfOf(n){
 const PW=595.28,PHt=841.89,k=PW/W,PH=PHt/k;let maxY=0;for(const s of n.ink){const P=pathOf(s);if(P.y1>maxY)maxY=P.y1}
 const pages=Math.max(1,Math.ceil((maxY+10)/PH)),f=v=>v.toFixed(1),streams=[];
 const circ=(x,y,r)=>{const c=r*.5523;return`${f(x+r)} ${f(y)} m ${f(x+r)} ${f(y+c)} ${f(x+c)} ${f(y+r)} ${f(x)} ${f(y+r)} c ${f(x-c)} ${f(y+r)} ${f(x-r)} ${f(y+c)} ${f(x-r)} ${f(y)} c ${f(x-r)} ${f(y-c)} ${f(x-c)} ${f(y-r)} ${f(x)} ${f(y-r)} c ${f(x+c)} ${f(y-r)} ${f(x+r)} ${f(y-c)} ${f(x+r)} ${f(y)} c f\n`};
 for(let pg=0;pg<pages;pg++){let s=`${k.toFixed(5)} 0 0 ${(-k).toFixed(5)} 0 ${PHt.toFixed(2)} cm 1 0 0 1 0 ${f(-pg*PH)} cm\n`;
  for(const str of n.ink){const P=pathOf(str);if(P.y1<pg*PH-5||P.y0>(pg+1)*PH+5)continue;const p=P.p;s+=hex(P.c)+' rg\n';
   const[L,R,r]=outline(p);s+=circ(p[0][0],p[0][1],r[0]);
   if(p.length>1){s+=circ(p[p.length-1][0],p[p.length-1][1],r[p.length-1]);const poly=L.concat(R.slice().reverse());
    s+=poly.map((q,i)=>f(q[0])+' '+f(q[1])+(i?' l':' m')).join('\n')+' h f\n'}}
  streams.push(s)}
 const objs=[],kids=[];
 objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
 streams.forEach((s,i)=>{const po=3+i*2,co=4+i*2;kids.push(po+' 0 R');
  objs[po]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PHt}] /Contents ${co} 0 R /Resources << >> >>`;
  objs[co]=`<< /Length ${s.length} >>\nstream\n${s}endstream`});
 objs[2]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
 let out='%PDF-1.4\n';const off=[];
 for(let i=1;i<objs.length;i++){off[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
 const x=out.length;out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
 out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
 return new Blob([out],{type:'application/pdf'})}
$('pdf').onclick=()=>{commitSel();const n=notes[cur];if(n)deliver(pdfOf(n),fname(n)+'.pdf')};

/* ---------- zip de toutes les notes en PDF (zip simple, sans compression) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zipOf(files){
 const te=new TextEncoder(),parts=[],cent=[];let off=0;
 const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
 for(const f of files){const nm=te.encode(f.name),c=crc32(f.data),sz=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
  h.setUint32(14,c,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,nm.length,true);parts.push(h,nm,f.data);
  const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
  e.setUint32(16,c,true);e.setUint32(20,sz,true);e.setUint32(24,sz,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);cent.push(e,nm);
  off+=30+nm.length+sz}
 const cs=cent.reduce((a,x)=>a+x.byteLength,0),end=new DataView(new ArrayBuffer(22));
 end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
 return new Blob([...parts,...cent,end],{type:'application/zip'})}
$('zip').onclick=async()=>{commitSel();const arr=sorted().filter(n=>n.ink.length);if(!arr.length){toast('Aucune note à exporter');return}
 const used={},files=[];
 for(const n of arr){let b=n.name?fname(n):'note '+new Date(n.t).toISOString().slice(0,16).replace('T',' ').replace(':','h');
  let nm=b,i=2;while(used[nm.toLowerCase()])nm=b+' ('+(i++)+')';used[nm.toLowerCase()]=1;
  files.push({name:nm+'.pdf',data:new Uint8Array(await pdfOf(n).arrayBuffer())})}
 files.push({name:'notor-sauvegarde-'+stamp()+'.json',data:new TextEncoder().encode(JSON.stringify(notes))});
 if(await deliver(zipOf(files),'notor-'+stamp()+'.zip')){try{localStorage.setItem(KEY+'-export',Date.now())}catch(e){}warn('')}};

const ro=new ResizeObserver(()=>size());ro.observe(sheet);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
load().then(()=>{
 for(const n of Object.values(notes))if(!n.ink.length&&!n.name)delete notes[n.id];
 const f=sorted()[0];open(f&&innerWidth>900?f.id:null);
 let last=0;try{last=+localStorage.getItem(KEY+'-export')||0}catch(e){}
 if(Object.keys(notes).length&&Date.now()-last>7*864e5)warn(last?'Dernière sauvegarde il y a plus d’une semaine : touche Exporter.':'Pense à sauvegarder : touche Exporter.');
});
}
