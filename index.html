<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone.png">
<meta name="theme-color" content="#f07a1a">
<title>Notor</title>
<style>
/* VOICE: calme, sans chichi, un outil qu'on oublie
   IDEA: un carnet à spirale, la page blanche est le centre
   PICTURE: la feuille d'écriture elle-même, pleine hauteur
   COLOUR and TYPE: blanc / gris pierre, accent orange #f07a1a ; Inter
   LAYOUT: liste fine à gauche, feuille à droite ; une seule vue sous 700px */
:root{color-scheme:light dark;--bg:light-dark(#f4f2ef,#151413);--panel:light-dark(#fff,#1e1d1b);--ink:light-dark(#1b1a19,#ecebe8);--mute:light-dark(#8a857f,#8f8a84);--line:light-dark(#e4e0db,#2c2a27);--acc:#f07a1a;--sel:light-dark(#fff1e4,#2e2115)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,-apple-system,system-ui,sans-serif;overflow:hidden}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
button{white-space:nowrap;flex:none;font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:10px;min-height:40px;padding:0 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);height:100%;overflow:hidden}
.top{display:flex;gap:6px;align-items:center;padding:10px 10px 6px}
.top h1{font-size:20px;margin:0 auto 0 4px;letter-spacing:-.01em}
.top h1 b{color:var(--acc)}
.new{background:var(--acc);color:#fff;font-weight:600;font-size:22px;width:40px;padding:0;line-height:1}
.search{margin:0 10px 8px;padding:0 12px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;width:calc(100% - 20px)}
.list{flex:1;overflow-y:auto;padding:0 6px 10px}
.item{display:block;width:100%;text-align:left;padding:8px 10px;margin:1px 0;min-height:0}
.item.on{background:var(--sel)}
.item .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s i{font-style:normal;color:var(--acc);margin-right:6px}
.warn{margin:0 8px 6px;padding:8px 10px;border-radius:10px;background:var(--sel);color:var(--ink);font-size:13px}
.foot{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}.foot button,.imp{color:var(--acc);font-size:14px;min-height:36px;display:flex;align-items:center;padding:0 10px;cursor:pointer}
.empty{color:var(--mute);font-size:14px;padding:16px 10px}
main{display:flex;flex-direction:column;height:100%;background:var(--panel);overflow:hidden}
.bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute)}
.bar .info{margin-right:auto;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{color:var(--acc);font-size:15px}
.back{display:none}
textarea{flex:1;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:17px/1.6 Inter,-apple-system,system-ui,sans-serif;padding:18px clamp(16px,4vw,48px) 40vh;overflow-y:auto}
textarea::placeholder{color:var(--mute)}
.mode{display:flex;background:var(--bg);border-radius:10px;padding:2px;margin-right:6px}
.mode button{min-height:34px;padding:0 10px;color:var(--mute);font-size:14px}
.mode button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px #0002}
.tools{display:none;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ink .tools{display:flex}
.tools button{min-height:36px;padding:0 10px;font-size:14px;color:var(--mute)}
.tools button.on{color:var(--acc);background:var(--sel)}
.dot{width:26px;height:26px;border-radius:50%;padding:0;min-height:0;border:2px solid transparent}
.tools .dot{min-height:26px;height:26px;padding:0}
.dot.on{border-color:var(--acc);background:none}
.dot i{display:block;width:16px;height:16px;border-radius:50%;margin:auto}
.tools .sep{flex:1}
.tools label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;padding:0 6px}
.sheet{display:none;flex:1;overflow-y:auto;position:relative;background:var(--panel)}
.ink .sheet{display:block}.ink textarea{display:none}
.sheet canvas{display:block;touch-action:none;width:100%;
 background-image:repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px) var(--lh));--lh:36px}
.ask{position:fixed;inset:0;display:none;place-items:center;background:#0006;z-index:9}
.ask.on{display:grid}
.ask div{background:var(--panel);border-radius:14px;padding:18px;width:min(320px,90vw);text-align:center}
.ask p{margin:0 0 14px}
.ask button{width:48%}
.ask .del{background:#d6402b;color:#fff}
.sync{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block;margin-right:6px;vertical-align:middle}
.sync.ok{background:#3aa55b}.sync.wait{background:var(--acc)}
@media(max-width:700px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside{border:0}
 main{display:none}
 .app.edit aside{display:none}.app.edit main{display:flex}
 .back{display:inline-block;padding:0 8px 0 4px}
 .bar{flex-wrap:wrap}.bar .info{display:none}.bar .mode{margin-right:auto}
 .bar button{padding:0 8px}
}
</style>
</head>
<body>
<div class="app" id="app">
 <aside>
  <div class="top"><h1>Not<b>or</b></h1><button class="new" id="new" aria-label="Nouvelle note">+</button></div>
  <input class="search" id="q" type="search" placeholder="Rechercher" autocomplete="off">
  <div class="list" id="list"></div>
  <div class="warn" id="warn" hidden></div>
  <div class="foot"><button id="exp">Exporter</button><label class="imp">Importer<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
 </aside>
 <main id="main">
  <div class="bar">
   <button class="back" id="back">‹ Notes</button>
   <span class="info"><span id="info"></span></span>
   <span class="mode"><button id="mT" class="on">Texte</button><button id="mI">Main</button></span>
   <button id="pin">Épingler</button>
   <button id="copy">Copier</button>
   <button id="trash">Supprimer</button>
  </div>
  <div class="tools">
   <button class="dot on" data-c="ink" aria-label="Encre"><i style="background:var(--ink)"></i></button>
   <button class="dot" data-c="#f07a1a" aria-label="Orange"><i style="background:#f07a1a"></i></button>
   <button class="dot" data-c="#2f6fd6" aria-label="Bleu"><i style="background:#2f6fd6"></i></button>
   <button id="tPen" class="on">Stylo</button><button id="tFine">Fin</button><button id="tEr">Gomme</button>
   <button id="undo">Annuler</button>
   <span class="sep"></span>
   <label><input type="checkbox" id="finger"> Doigt aussi</label>
  </div>
  <div class="sheet" id="sheet"><canvas id="cv"></canvas></div>
  <textarea id="ed" placeholder="Écris ici… La première ligne devient le titre." spellcheck="true"></textarea>
 </main>
</div>
<div class="ask" id="ask"><div><p>Supprimer cette note ?</p><button id="no">Annuler</button> <button class="del" id="yes">Supprimer</button></div></div>
<script>
{
const $=id=>document.getElementById(id);
const app=$('app'),list=$('list'),ed=$('ed'),q=$('q'),info=$('info');
const KEY='notor-v1';
let notes={},cur=null,coll=null,timer=null,saving={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Stockage : IndexedDB (grande capacité), localStorage seulement en secours */
let idb=null,saveT=null;
const openDB=()=>new Promise(r=>{setTimeout(()=>r(null),2000);try{const q=indexedDB.open('notor',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbGet=k=>new Promise(r=>{try{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idbPut=(k,v)=>new Promise(r=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}});
async function loadLocal(){
 idb=await openDB();let d=idb?await idbGet('notes'):null;
 if(!d){try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){d={}}if(idb&&d&&Object.keys(d).length)await idbPut('notes',d)}
 notes=d||{};
}
function writeNow(){clearTimeout(saveT);saveT=null;
 if(idb)idbPut('notes',notes).then(ok=>{if(!ok)warn('Enregistrement impossible : mémoire pleine ? Exporte tes notes.')});
 else try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){warn('Enregistrement impossible : mémoire pleine ? Exporte tes notes.')}}
const saveLocal=()=>{if(!saveT)saveT=setTimeout(writeNow,300)};
addEventListener('pagehide',()=>{if(saveT)writeNow()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT)writeNow()});
function warn(m){const w=$('warn');w.textContent=m;w.hidden=false}
const hasInk=n=>n.ink&&n.ink.length;
const title=n=>(n.text||'').trim().split('\n')[0].slice(0,80)||(hasInk(n)?'Note manuscrite':'Nouvelle note');
const snippet=n=>(hasInk(n)?'✎ ':'')+(n.text||'').trim().split('\n').slice(1).join(' ').trim().slice(0,90);
const when=t=>{const d=new Date(t),n=new Date();
 if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:d.getFullYear()===n.getFullYear()?undefined:'numeric'})};
const sorted=()=>Object.values(notes).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.t-a.t);

function render(){
 const f=q.value.trim().toLowerCase();
 const arr=sorted().filter(n=>!f||(n.text||'').toLowerCase().includes(f));
 list.innerHTML=arr.length?arr.map(n=>`<button class="item${n.id===cur?' on':''}" data-id="${esc(n.id)}"><div class="t">${n.pin?'📌 ':''}${esc(title(n))}</div><div class="s"><i>${esc(when(n.t))}</i>${esc(snippet(n))}</div></button>`).join('')
  :`<div class="empty">${f?'Aucune note ne contient « '+esc(q.value)+' ».':'Aucune note. Touche + pour commencer.'}</div>`;
 const n=notes[cur];
 if(!n)main.classList.remove('ink');
 info.textContent=n?'Modifiée '+when(n.t)+' · '+(n.text||'').trim().split(/\s+/).filter(Boolean).length+' mots':'';
 $('pin').textContent=n&&n.pin?'Désépingler':'Épingler';
 ['pin','copy','trash'].forEach(b=>$(b).style.visibility=n?'visible':'hidden');
 ed.disabled=!n;
}
function open(id,focus){
 cur=id;const n=notes[id];ed.value=n?n.text:'';undoStack=[];setMode(n?n.mode||'t':'t',1);
 app.classList.toggle('edit',!!n);render();
 if(n&&focus)ed.focus();
}
function remote(){}
function touch(id){notes[id].t=Date.now();saveLocal();render();clearTimeout(timer);timer=setTimeout(()=>remote(id),700)}
function create(){
 const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 notes[id]={id,text:'',t:Date.now(),pin:false,ink:[],mode:prefMode};saveLocal();q.value='';open(id,true);remote(id);
}
ed.addEventListener('input',()=>{if(!notes[cur])return;notes[cur].text=ed.value;touch(cur)});
list.addEventListener('click',e=>{const b=e.target.closest('.item');if(b)open(b.dataset.id,innerWidth>700)});
$('new').onclick=create;
$('back').onclick=()=>{app.classList.remove('edit');cleanEmpty()};
q.addEventListener('input',render);
$('pin').onclick=()=>{const n=notes[cur];if(!n)return;n.pin=!n.pin;saveLocal();render();remote(cur)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(ed.value);$('copy').textContent='Copié ✓'}catch(e){ed.select();$('copy').textContent='Sélectionné'}setTimeout(()=>$('copy').textContent='Copier',1400)};
$('trash').onclick=()=>$('ask').classList.add('on');
$('no').onclick=()=>$('ask').classList.remove('on');
$('yes').onclick=()=>{$('ask').classList.remove('on');const id=cur;delete notes[id];saveLocal();remote(id);const f=sorted()[0];open(f&&innerWidth>700?f.id:null);if(innerWidth<=700)app.classList.remove('edit')};
function cleanEmpty(){for(const n of Object.values(notes))if(n.id!==cur&&!(n.text||'').trim()&&!hasInk(n)){delete notes[n.id];remote(n.id)}saveLocal();render()}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();create()}});

/* ---- Écriture manuscrite : seul le stylet trace, la paume est ignorée ---- */
const main=$('main'),sheet=$('sheet'),cv=$('cv'),cx=cv.getContext('2d');
const W=1000;let scale=1,pageH=1600,color='ink',tool='pen',undoStack=[],drawing=null,lastPen=0,prefMode='t',fingerOK=false,pan=null;
try{prefMode=localStorage.getItem(KEY+'-mode')||'t';fingerOK=localStorage.getItem(KEY+'-finger')==='1'}catch(e){}
$('finger').checked=fingerOK;
function setMode(m,silent){
 main.classList.toggle('ink',m==='i');$('mT').classList.toggle('on',m!=='i');$('mI').classList.toggle('on',m==='i');
 if(m==='i')requestAnimationFrame(size);
 if(!silent&&notes[cur]){notes[cur].mode=m;prefMode=m;try{localStorage.setItem(KEY+'-mode',m)}catch(e){}saveLocal();remote(cur)}
}
const inkColor=c=>c==='ink'?getComputedStyle(document.body).color:c;
const parse=s=>{const[c,w,pts]=s.split('|');const a=(pts||'').split(' ').map(Number);const p=[];for(let i=0;i+2<a.length;i+=3)p.push([a[i],a[i+1],a[i+2]]);return{c,w:+w,p}};
const enc=st=>st.c+'|'+st.w+'|'+st.p.map(q=>Math.round(q[0])+' '+Math.round(q[1])+' '+q[2]).join(' ');
function size(){
 const n=notes[cur];if(!n||!main.classList.contains('ink'))return;
 const cw=sheet.clientWidth;if(!cw)return;scale=cw/W;
 let maxY=0;for(const s of n.ink||[]){const st=parse(s);for(const q of st.p)if(q[1]>maxY)maxY=q[1]}
 pageH=Math.max(Math.ceil(sheet.clientHeight/scale)+200,maxY+700);
 const dpr=devicePixelRatio||1;cv.width=cw*dpr;cv.height=pageH*scale*dpr;cv.style.height=pageH*scale+'px';
 cv.style.setProperty('--lh',Math.max(28,40*scale)+'px');cx.setTransform(dpr*scale,0,0,dpr*scale,0,0);redraw();
}
function stroke(st){
 cx.strokeStyle=inkColor(st.c);cx.lineCap=cx.lineJoin='round';const p=st.p;
 if(p.length===1){cx.fillStyle=cx.strokeStyle;cx.beginPath();cx.arc(p[0][0],p[0][1],st.w*.6,0,7);cx.fill();return}
 for(let i=1;i<p.length;i++){cx.lineWidth=st.w*(.45+p[i][2]/9*.9);cx.beginPath();cx.moveTo(p[i-1][0],p[i-1][1]);cx.lineTo(p[i][0],p[i][1]);cx.stroke()}
}
function redraw(){cx.clearRect(0,0,W,pageH);const n=notes[cur];if(n)for(const s of n.ink||[])stroke(parse(s))}
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale,Math.max(1,Math.min(9,Math.round((e.pressure||.5)*9)))]};
function erase(q){const n=notes[cur];const before=n.ink.length;
 n.ink=n.ink.filter(s=>!parse(s).p.some(a=>Math.hypot(a[0]-q[0],a[1]-q[1])<14));
 if(n.ink.length!==before){redraw();touch(cur)}}
cv.addEventListener('pointerdown',e=>{
 const n=notes[cur];if(!n)return;
 const pen=e.pointerType==='pen'||e.pointerType==='mouse'||(fingerOK&&e.pointerType==='touch');
 if(!pen){ // doigt ou paume : on fait défiler, sauf si le stylet vient de toucher (rejet de paume)
  if(drawing||Date.now()-lastPen<600)return;
  pan={id:e.pointerId,y:e.clientY,top:sheet.scrollTop};return}
 e.preventDefault();cv.setPointerCapture(e.pointerId);pan=null;lastPen=Date.now();
 undoStack.push(n.ink.slice());if(undoStack.length>50)undoStack.shift();
 const q=pos(e);
 if(tool==='er'){drawing={id:e.pointerId,er:1};erase(q);return}
 drawing={id:e.pointerId,st:{c:color,w:tool==='fine'?2.2:4,p:[q]}};stroke(drawing.st);
});
cv.addEventListener('pointermove',e=>{
 if(pan&&e.pointerId===pan.id){sheet.scrollTop=pan.top-(e.clientY-pan.y);return}
 if(!drawing||e.pointerId!==drawing.id)return;lastPen=Date.now();
 const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 for(const ev of evs){const q=pos(ev);
  if(drawing.er){erase(q);continue}
  const p=drawing.st.p,l=p[p.length-1];if(Math.hypot(q[0]-l[0],q[1]-l[1])<1.2)continue;
  p.push(q);cx.strokeStyle=inkColor(drawing.st.c);cx.lineCap='round';cx.lineWidth=drawing.st.w*(.45+q[2]/9*.9);
  cx.beginPath();cx.moveTo(l[0],l[1]);cx.lineTo(q[0],q[1]);cx.stroke()}
});
const up=e=>{
 if(pan&&e.pointerId===pan.id)pan=null;
 if(!drawing||e.pointerId!==drawing.id)return;lastPen=Date.now();
 if(!drawing.er){notes[cur].ink.push(enc(drawing.st));touch(cur);if(drawing.st.p.some(q=>q[1]>pageH-400))size()}
 else if(undoStack.length&&undoStack[undoStack.length-1].length===notes[cur].ink.length)undoStack.pop();
 drawing=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('touchstart',e=>{if(e.touches.length&&[...e.touches].some(t=>t.touchType==='stylus'))e.preventDefault()},{passive:false});
$('mT').onclick=()=>setMode('t');$('mI').onclick=()=>setMode('i');
document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.dot').forEach(x=>x.classList.toggle('on',x===b));if(tool==='er')setTool('pen')});
function setTool(t){tool=t;$('tPen').classList.toggle('on',t==='pen');$('tFine').classList.toggle('on',t==='fine');$('tEr').classList.toggle('on',t==='er')}
$('tPen').onclick=()=>setTool('pen');$('tFine').onclick=()=>setTool('fine');$('tEr').onclick=()=>setTool('er');
$('undo').onclick=()=>{const n=notes[cur];if(!n||!undoStack.length)return;n.ink=undoStack.pop();size();touch(cur)};
$('finger').onchange=()=>{fingerOK=$('finger').checked;try{localStorage.setItem(KEY+'-finger',fingerOK?'1':'0')}catch(e){}};
const ro=new ResizeObserver(()=>size());ro.observe(sheet);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

$('exp').onclick=()=>{const blob=new Blob([JSON.stringify(notes)],{type:'application/json'});const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='notor-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
 try{localStorage.setItem(KEY+'-export',Date.now())}catch(e){}$('warn').hidden=true};
$('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());let k=0;
 for(const id in d){const v=d[id];if(!v||typeof v!=='object')continue;const l=notes[id];if(!l||(+v.t||0)>l.t){notes[id]={id,text:String(v.text||''),t:+v.t||Date.now(),pin:!!v.pin,ink:Array.isArray(v.ink)?v.ink.map(String):[],mode:v.mode==='i'?'i':'t'};k++}}
 saveLocal();render();info.textContent=k+' note(s) importée(s)'}catch(err){info.textContent='Fichier illisible'}e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

loadLocal().then(()=>{const first=sorted()[0];open(first&&innerWidth>700?first.id:null);
 let last=0;try{last=+localStorage.getItem(KEY+'-export')||0}catch(e){}
 const has=Object.values(notes).some(n=>(n.text||'').trim()||hasInk(n));
 if(has&&Date.now()-last>7*864e5)warn(last?'Dernière sauvegarde il y a plus d’une semaine. Touche Exporter.':'Pense à sauvegarder tes notes : touche Exporter.');
});

}
</script>
</body>
</html>
